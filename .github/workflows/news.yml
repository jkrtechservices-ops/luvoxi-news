name: Publish news

on:
  schedule:
    - cron: "0 */6 * * *"
  push:
    paths:
      - "run-now.txt"
  workflow_dispatch:
    inputs:
      trend:
        description: "Trending posts"
        default: "1"
      guide:
        description: "City guide posts"
        default: "1"

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Generate posts and site
        run: python generate.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TREND_PER_RUN: ${{ github.event.inputs.trend || (github.event_name == 'push' && '2' || '1') }}
          GUIDE_PER_RUN: ${{ github.event.inputs.guide || (github.event_name == 'push' && '2' || '1') }}

      - name: Commit changes
        run: |
          git config user.name "news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "auto: new posts" && git pull --rebase && git push)

      - name: Ping IndexNow (Bing and others)
        run: |
          sleep 150
          python generate.py --ping
